[project]
name = "shelf-to-shop"
version = "0.1.0"
description = "Turn a shop walkthrough video into a WhatsApp-ready catalog, a Meta catalog feed and clean product photos."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "meta-sam-parser==0.1.0",
  "numpy>=2.1",
  "pillow>=11.0",
  "pydantic>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.17",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine", "src/shelf", "src/integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Spikes are throwaway exploration scripts: allow prints and subprocess calls to ffmpeg.
"spikes/**" = ["T201", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["engine", "shelf", "integrations"]
