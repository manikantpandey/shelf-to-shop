[project]
name = "shelf-to-shop"
version = "0.1.0"
description = "Turn a shop walkthrough video into a WhatsApp-ready catalog, a Meta catalog feed and clean product photos."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.1",
  "fastapi>=0.162.0",
  "httpx>=0.28",
  "meta-sam-parser==0.1.0",
  "numpy>=2.1",
  "pillow>=11.0",
  "psycopg[binary]>=3.3.6",
  "pydantic>=2.9",
  "pydantic-settings>=2.16.1",
  "sqlalchemy>=2.1.6",
  "structlog>=26.1.0",
  "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.17",
  "mypy>=1.13",
  "hypothesis>=6.170.12",
  "respx>=0.23.1",
  "import-linter>=2.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine", "src/shelf", "src/integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "RUF001"]
# Devanagari digits and words are intentional in the price vocabulary.
"src/engine/prices/**" = ["RUF001"]
# Spikes are throwaway exploration scripts: allow prints and subprocess calls to ffmpeg.
"spikes/**" = ["T201", "S603", "S607", "E501", "S101", "RUF001", "RUF028", "BLE001"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["engine", "shelf", "integrations"]
