title = "shelf-to-shop gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "meta-model-api-key"
description = "Meta Model API key (LLM_<numeric id>_<secret>)"
regex = '''\bLLM_[0-9]{6,}_[A-Za-z0-9._\-]{16,}'''
keywords = ["llm_"]

[[rules]]
id = "shelf-to-shop-api-key"
description = "Shelf-to-Shop workspace API key (sts_<env>_<prefix>.<secret>)"
regex = '''\bsts_(live|test)_[a-z0-9]{8}\.[A-Za-z0-9_\-]{32,}'''
keywords = ["sts_"]

[[rules]]
id = "baseten-api-key-quoted"
description = "Baseten API key assigned as a quoted literal in code or config"
regex = '''(?i)baseten[_-]?api[_-]?key["']?\s*[:=]\s*["'][A-Za-z0-9._\-]{20,}["']'''
keywords = ["baseten"]

[[rules]]
id = "baseten-api-key-env"
description = "Baseten API key in a dotenv-style line"
regex = '''(?m)^\s*BASETEN_API_KEY\s*=\s*[A-Za-z0-9._\-]{20,}\s*$'''
keywords = ["baseten_api_key"]
