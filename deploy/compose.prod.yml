# Production on one VM: Caddy (HTTPS + web app) -> API, a worker, Postgres.
# Started by deploy/bootstrap.sh with deploy/.env (written from AWS Parameter Store).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shelf
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf"]
      interval: 5s
      retries: 20

  api:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shelf:${POSTGRES_PASSWORD}@db:5432/shelf
      STORAGE_DIR: /data
    volumes:
      - media:/data
    command: ["sh", "-c", "alembic upgrade head && uvicorn --factory shelf.main:create_app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://shelf:${POSTGRES_PASSWORD}@db:5432/shelf
      STORAGE_DIR: /data
    volumes:
      - media:/data
    command: ["python", "-m", "shelf.jobs.worker"]
    depends_on:
      api: { condition: service_started }

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_BASE_URL: https://${SITE_HOST:?set SITE_HOST}
        VITE_SITE_URL: https://${SITE_HOST:?set SITE_HOST}
    restart: unless-stopped
    environment:
      SITE_HOST: ${SITE_HOST}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
